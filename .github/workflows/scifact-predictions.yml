name: ORACLE SciFact prediction benchmark

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/scifact-predictions.yml"
      - "oracle/scifact_predict.py"
      - "oracle/scifact_benchmark.py"
      - "oracle/model_agents.py"
  workflow_dispatch:
    inputs:
      split:
        description: Labelled SciFact split
        required: true
        type: choice
        options: [dev, train]
        default: dev
      model:
        description: Gemini model ID
        required: true
        type: string
        default: gemini-3.5-flash-lite
      max_claims:
        description: Optional pilot cap (0 = full split)
        required: true
        type: string
        default: "0"

permissions:
  contents: read

jobs:
  predict-and-score:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ORACLE_GEMINI_FALLBACK_MODELS: ""
      SPLIT: ${{ github.event_name == 'workflow_dispatch' && inputs.split || 'dev' }}
      MODEL: ${{ github.event_name == 'workflow_dispatch' && inputs.model || 'gemini-3.5-flash-lite' }}
      MAX_CLAIMS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_claims || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check model credential
        id: credential
        shell: bash
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Prediction generation skipped: add GEMINI_API_KEY as a repository Actions secret, then dispatch this workflow again."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Explain skipped live prediction run
        if: steps.credential.outputs.available != 'true'
        run: |
          {
            echo "## SciFact prediction benchmark"
            echo "No Gemini API credential is configured in GitHub Actions."
            echo "No model predictions or benchmark metrics were generated."
            echo "Add the repository secret GEMINI_API_KEY and manually dispatch this workflow to run the benchmark."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Download official SciFact data
        if: steps.credential.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/scifact
          curl --fail --location --retry 4 --retry-all-errors \
            https://scifact.s3-us-west-2.amazonaws.com/release/latest/data.tar.gz \
            -o data/scifact/data.tar.gz
          tar -xzf data/scifact/data.tar.gz -C data/scifact
          claims="$(find data/scifact -name "claims_${SPLIT}.jsonl" -print -quit)"
          corpus="$(find data/scifact -name corpus.jsonl -print -quit)"
          test -n "$claims" && test -n "$corpus"
          echo "CLAIMS_PATH=$claims" >> "$GITHUB_ENV"
          echo "CORPUS_PATH=$corpus" >> "$GITHUB_ENV"
      - name: Generate frozen ORACLE predictions
        if: steps.credential.outputs.available == 'true'
        timeout-minutes: 100
        shell: bash
        run: |
          set -euo pipefail
          args=(--claims "$CLAIMS_PATH" --corpus "$CORPUS_PATH"
                --output data/scifact/oracle_predictions_${SPLIT}.jsonl
                --model "$MODEL" --top-k 8)
          if [ "$MAX_CLAIMS" != "0" ]; then args+=(--max-claims "$MAX_CLAIMS"); fi
          python -m oracle.scifact_predict "${args[@]}" --request-interval 4.2
      - name: Score frozen predictions
        if: steps.credential.outputs.available == 'true'
        run: |
          python -m oracle.scifact_benchmark \
            --claims "$CLAIMS_PATH" --corpus "$CORPUS_PATH" \
            --predictions "data/scifact/oracle_predictions_${SPLIT}.jsonl" \
            --split "$SPLIT" > "data/scifact/oracle_scifact_report_${SPLIT}.json"
      - name: Upload predictions, provenance, and report
        if: steps.credential.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: oracle-scifact-${{ env.SPLIT }}-${{ github.run_id }}
          path: |
            data/scifact/oracle_predictions_${{ env.SPLIT }}.jsonl
            data/scifact/oracle_predictions_${{ env.SPLIT }}.jsonl.meta.json
            data/scifact/oracle_scifact_report_${{ env.SPLIT }}.json
          if-no-files-found: error
          retention-days: 90
