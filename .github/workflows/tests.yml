name: ORACLE offline tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python matrix tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Build and install distributable package
        run: python -m pip install .
      - name: Installed CLI smoke test outside the source tree
        run: |
          cd /tmp
          oracle --help
          oracle "How does a fertilized egg develop?" --cycles 1 --db /tmp/oracle-installed-ci.sqlite3


  bioconductor:
    name: Live R/Bioconductor reference checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - name: Install Bioconductor packages
        run: |
          Rscript -e 'if (!requireNamespace("BiocManager", quietly=TRUE)) install.packages("BiocManager", repos="https://cloud.r-project.org")'
          Rscript -e 'BiocManager::install(c("edgeR", "limma"), ask=FALSE, update=FALSE)'
      - name: Run live R integration checks
        run: python -m unittest discover -s tests -p 'test_bioconductor_integration.py' -v

  riken2018_metadata:
    name: RIKEN 2018 supercentenarian metadata provenance
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parquet reader
        run: python -m pip install --disable-pip-version-check pandas==2.2.3 pyarrow==18.1.0
      - name: Download and inspect source-checksummed metadata
        run: python scripts/probe_riken2018_metadata.py
      - name: Upload metadata probe
        uses: actions/upload-artifact@v4
        with:
          name: oracle-riken2018-metadata-probe
          path: artifacts/riken2018/
          if-no-files-found: error
          retention-days: 90

  gse237029_raw_cel:
    name: GSE237029 raw CEL source and GPL570 RMA
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test GEO SOFT parser
        run: python -m unittest discover -s tests -p 'test_gse237029_source_bundle.py' -v
      - name: Download official NCBI GEO source records
        run: |
          set -euo pipefail
          mkdir -p artifacts/gse237029
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 30 --max-time 600 \
            https://ftp.ncbi.nlm.nih.gov/geo/series/GSE237nnn/GSE237029/soft/GSE237029_family.soft.gz \
            -o artifacts/gse237029/GSE237029_family.soft.gz
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 30 --max-time 1200 \
            https://ftp.ncbi.nlm.nih.gov/geo/series/GSE237nnn/GSE237029/suppl/GSE237029_RAW.tar \
            -o artifacts/gse237029/GSE237029_RAW.tar
          gzip -t artifacts/gse237029/GSE237029_family.soft.gz
          tar -tf artifacts/gse237029/GSE237029_RAW.tar >/dev/null
      - name: Authenticate sample manifest and extract nine CEL files
        run: |
          python scripts/audit_gse237029_source_bundle.py \
            --soft artifacts/gse237029/GSE237029_family.soft.gz \
            --raw-tar artifacts/gse237029/GSE237029_RAW.tar \
            --output-dir artifacts/gse237029
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true
      - name: Install GPL570 RMA and annotation dependencies
        run: |
          Rscript -e 'if (!requireNamespace("BiocManager", quietly=TRUE)) install.packages("BiocManager"); BiocManager::install(c("affy","hgu133plus2cdf","hgu133plus2.db","AnnotationDbi","limma"), ask=FALSE, update=FALSE, Ncpus=2); if (!requireNamespace("jsonlite", quietly=TRUE)) install.packages("jsonlite")'
          Rscript -e 'stopifnot(requireNamespace("affy"),requireNamespace("hgu133plus2cdf"),requireNamespace("hgu133plus2.db"),requireNamespace("AnnotationDbi"),requireNamespace("limma"),requireNamespace("jsonlite"))'
      - name: Run joint raw-CEL RMA and prespecified mRPG-8 sensitivity
        run: |
          Rscript scripts/analyze_gse237029_rma.R \
            artifacts/gse237029/sample_manifest.tsv \
            artifacts/gse237029/analysis
      - name: Upload source, RMA and analysis artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-gse237029-raw-cel-rma
          path: artifacts/gse237029/
          if-no-files-found: warn
          retention-days: 90
