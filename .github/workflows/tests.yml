name: ORACLE offline tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python matrix tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Build and install distributable package
        run: python -m pip install .
      - name: Installed CLI smoke test outside the source tree
        run: |
          cd /tmp
          oracle --help
          oracle "How does a fertilized egg develop?" --cycles 1 --db /tmp/oracle-installed-ci.sqlite3


  bioconductor:
    name: Live R/Bioconductor reference checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - name: Install Bioconductor packages
        run: |
          Rscript -e 'if (!requireNamespace("BiocManager", quietly=TRUE)) install.packages("BiocManager", repos="https://cloud.r-project.org")'
          Rscript -e 'BiocManager::install(c("edgeR", "limma"), ask=FALSE, update=FALSE)'
      - name: Run live R integration checks
        run: python -m unittest discover -s tests -p 'test_bioconductor_integration.py' -v

  riken2018_metadata:
    name: RIKEN 2018 supercentenarian metadata provenance
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parquet reader
        run: python -m pip install --disable-pip-version-check pandas==2.2.3 pyarrow==18.1.0
      - name: Download and inspect source-checksummed metadata
        run: python scripts/probe_riken2018_metadata.py
      - name: Upload metadata probe
        uses: actions/upload-artifact@v4
        with:
          name: oracle-riken2018-metadata-probe
          path: artifacts/riken2018/
          if-no-files-found: error
          retention-days: 90

  riken2018_h5ad_schema:
    name: RIKEN SC2018 H5AD checksum and schema
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install AnnData reader
        run: python -m pip install --disable-pip-version-check anndata==0.10.8
      - name: Download, checksum and inspect H5AD metadata
        run: python scripts/probe_riken2018_h5ad_schema.py
      - name: Upload H5AD schema report
        uses: actions/upload-artifact@v4
        with:
          name: oracle-riken2018-h5ad-schema
          path: artifacts/riken2018-h5ad/
          if-no-files-found: error
          retention-days: 90
