name: ORACLE offline tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python matrix tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: python -m oracle "How does a fertilized egg develop?" --cycles 1 --db /tmp/oracle-ci.sqlite3


  bioconductor:
    name: Live R/Bioconductor reference checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - name: Install Bioconductor packages
        run: |
          Rscript -e 'if (!requireNamespace("BiocManager", quietly=TRUE)) install.packages("BiocManager", repos="https://cloud.r-project.org")'
          Rscript -e 'BiocManager::install(c("edgeR", "limma"), ask=FALSE, update=FALSE)'
      - name: Run live R integration checks
        run: python -m unittest tests.test_bioconductor_integration -v
