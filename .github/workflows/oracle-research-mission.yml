name: ORACLE longevity research mission

concurrency:
  group: oracle-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/oracle-research-mission.yml"
      - "oracle/**"
      - "scripts/analyze_human_aging_geo.R"
  workflow_dispatch:
    inputs:
      question:
        description: Scientific research question
        required: true
        type: string
        default: "Can we identify previously unknown biological mechanisms involved in human longevity?"
      mode:
        description: Research mode
        required: true
        type: choice
        options: [both, deep_research, autonomous_discovery]
        default: both
      domain:
        description: Specialist domain
        required: true
        type: choice
        options:
          - biology_medicine
          - physics_astronomy
          - chemistry_materials
          - computer_science_ai
          - earth_environment
          - mathematics_statistics
          - social_behavioral
          - engineering
          - general_science
          - history_archaeology
          - law_policy
          - economics_business
          - finance
          - philosophy_ethics
          - linguistics_literature
          - education
          - geography_urban
          - politics_governance
          - arts_culture
          - religion_theology
        default: biology_medicine
      cycles:
        description: Bounded research cycles
        required: true
        type: number
        default: 3
      limit:
        description: Maximum literature records per search
        required: true
        type: number
        default: 30
      dataset_max_mb:
        description: Maximum size of each GEO supplementary file in MB
        required: true
        type: number
        default: 50
      provider:
        description: Literature providers (NASA ADS requires NASA_ADS_API_TOKEN secret)
        required: true
        type: choice
        options: [auto, all, both, biology, europepmc, pubmed, crossref, geo, genbank, ensembl, arxiv, inspire_hep, pubchem, openalex, gbif, world_bank, noaa_ncei, clinical_trials, zenodo, harvard_dataverse, sra, pdb, pride, huggingface_datasets, openml, nasa_earthdata, usgs, figshare, internet_archive, loc, nasa_ads]
        default: all

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NASA_ADS_API_TOKEN: ${{ secrets.NASA_ADS_API_TOKEN }}
      MODEL_ALIAS: Qwen3-0.6B
      HF_REPO: Qwen/Qwen3-0.6B-GGUF
      HF_REVISION: 8e42d41f70cb6c571f58c3f31bd9287b372d97cc
      HF_FILE: Qwen3-0.6B-Q4_K_M.gguf
      MODEL_SHA256: b0638f08417a2d3c8652760462eb5407c6e30173cf9608ad0820757a281eea0e
      QUESTION: ${{ github.event_name == 'workflow_dispatch' && inputs.question || 'Can we identify previously unknown biological mechanisms involved in human longevity?' }}
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'both' }}
      DOMAIN: ${{ github.event_name == 'workflow_dispatch' && inputs.domain || 'biology_medicine' }}
      CYCLES: ${{ github.event_name == 'workflow_dispatch' && inputs.cycles || '3' }}
      LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.limit || '30' }}
      DATASET_MAX_MB: ${{ github.event_name == 'workflow_dispatch' && inputs.dataset_max_mb || '50' }}
      PROVIDER: ${{ github.event_name == 'workflow_dispatch' && inputs.provider || 'all' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ORACLE and CPU llama.cpp server
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install --only-binary=:all: --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu llama-cpp-python[server]==0.3.36
          pip install --upgrade huggingface_hub
      - name: Download and verify pinned local Qwen3 model
        run: |
          mkdir -p models/qwen3 data
          hf download "$HF_REPO" "$HF_FILE" --revision "$HF_REVISION" --local-dir models/qwen3
          echo "$MODEL_SHA256  models/qwen3/$HF_FILE" | sha256sum --check -
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path("data/local-model-provenance.json").write_text(json.dumps({
              "model_repository": os.environ["HF_REPO"],
              "model_revision": os.environ["HF_REVISION"],
              "model_file": os.environ["HF_FILE"],
              "model_sha256": os.environ["MODEL_SHA256"],
              "runtime": "llama-cpp-python CPU server",
              "runtime_version": "0.3.36",
              "api_key_required": False
          }, indent=2) + "\n")
          PY
      - name: Start local Qwen3 server for the research agents
        run: |
          nohup python -m llama_cpp.server \
            --model "models/qwen3/$HF_FILE" \
            --model_alias "$MODEL_ALIAS" \
            --host 127.0.0.1 --port 8000 \
            --n_ctx 8192 --n_threads 2 --n_batch 256 \
            > qwen3-mission-server.log 2>&1 &
          echo $! > qwen3-mission-server.pid
          for attempt in $(seq 1 120); do
            if curl --silent --fail http://127.0.0.1:8000/v1/models > qwen3-mission-models.json; then
              break
            fi
            sleep 5
          done
          test -s qwen3-mission-models.json
          grep -q "$MODEL_ALIAS" qwen3-mission-models.json
      - name: Run full ORACLE literature and discovery mission
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts data
          python -m oracle "$QUESTION" \
            --mode "$MODE" \
            --domain "$DOMAIN" \
            --cycles "$CYCLES" \
            --research-literature \
            --full-text \
            --citation-network \
            --incoming-citations \
            --discover-geo-files \
            --download-geo-files \
            --analyze-geo-files \
            --dataset-max-mb "$DATASET_MAX_MB" \
            --limit "$LIMIT" \
            --provider "$PROVIDER" \
            --local-model-url http://127.0.0.1:8000/v1 \
            --local-model-name "$MODEL_ALIAS" \
            --local-model-max-tokens 1024 \
            --local-model-timeout 180 \
            --db data/oracle.sqlite3 \
            --json > artifacts/oracle_research_run.json
      - name: Analyze public centenarian miRNA cohort
        run: |
          python scripts/analyze_gse32493_centenarian_mirna.py \
            --download \
            --data-dir data/gse32493 \
            --output artifacts/gse32493-centenarian-mirna-report.json
      - name: Summarize research run
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path("artifacts/oracle_research_run.json")
          lines = ["## ORACLE research mission"]
          if path.exists():
              try:
                  data = json.loads(path.read_text())
                  run = data.get("run", data) if isinstance(data, dict) else {}
                  if not isinstance(run, dict):
                      run = {}
                  lines.extend([
                      f"- Question: {run.get('question', 'see full report')}",
                      f"- Run ID: {run.get('run_id', 'see full report')}",
                      f"- Status: {run.get('status', 'see full report')}",
                      f"- Mode: {run.get('mode', 'see full report')}",
                      f"- Cycles: {run.get('current_cycle', run.get('cycles', 'see full report'))}",
                  ])
              except Exception as exc:
                  lines.append(f"- JSON summary unavailable: {exc}")
          else:
              lines.append("- Research output file was not produced; inspect the job log.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY
      - name: Audit evidence quality, replication, and novelty limits
        if: always() && hashFiles('artifacts/oracle_research_run.json') != ''
        run: |
          python -m oracle.quality_audit artifacts/oracle_research_run.json \
            --json-output artifacts/oracle_quality_audit.json \
            --markdown-output artifacts/oracle_quality_audit.md
          cat artifacts/oracle_quality_audit.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload ORACLE run database and research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-longevity-research-${{ github.run_id }}
          path: |
            artifacts/
            data/oracle.sqlite3
            data/geo/
            data/local-model-provenance.json
            qwen3-mission-server.log
            qwen3-mission-models.json
          if-no-files-found: warn
          retention-days: 90
