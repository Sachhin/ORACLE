name: Research assurance modules

on:
  push:
    branches: [main]
    paths:
      - "oracle/research_assurance.py"
      - "scripts/run_research_assurance.py"
      - "tests/test_research_assurance.py"
      - "docs/RESEARCH_ASSURANCE_MODULES.md"
      - ".github/workflows/research-assurance.yml"
  pull_request:
    branches: [main]
    paths:
      - "oracle/research_assurance.py"
      - "scripts/run_research_assurance.py"
      - "tests/test_research_assurance.py"
      - "docs/RESEARCH_ASSURANCE_MODULES.md"
      - ".github/workflows/research-assurance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assurance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deterministic assurance tests
        run: python -m unittest discover -s tests -p "test_research_assurance.py" -v
      - name: CLI help smoke test
        run: python scripts/run_research_assurance.py --help
