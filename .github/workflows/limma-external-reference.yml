name: External real-dataset limma-voom reference validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/limma-external-reference.yml"
      - "scripts/validate_gse176260_voom.R"
      - "scripts/validate_gse176261_voom.R"\n      - "scripts/validate_gse158765_voom.R"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/limma-external-reference.yml"
      - "scripts/validate_gse176260_voom.R"
      - "scripts/validate_gse176261_voom.R"\n      - "scripts/validate_gse158765_voom.R"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gse176260-reference:
    name: GSE176260 published voom reference
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out ORACLE
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.2"
          use-public-rspm: true

      - name: Install GEOquery, edgeR, limma, and digest
        run: |
          Rscript -e 'if (!requireNamespace("BiocManager", quietly=TRUE)) install.packages("BiocManager", repos="https://cloud.r-project.org")'
          Rscript -e 'BiocManager::install(c("GEOquery", "edgeR", "limma"), ask=FALSE, update=FALSE, Ncpus=2)'
          Rscript -e 'if (!requireNamespace("digest", quietly=TRUE)) install.packages("digest", repos="https://cloud.r-project.org")'
          Rscript -e 'stopifnot(requireNamespace("GEOquery"), requireNamespace("edgeR"), requireNamespace("limma"), requireNamespace("digest"))'

      - name: Download frozen GEO submitter reference files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation-artifacts
          base="https://ftp.ncbi.nlm.nih.gov/geo/series/GSE176nnn/GSE176260/suppl"
          for file in \
            GSE176260_QCed_counts_discovery.txt.gz \
            GSE176260_Log2_normalized_expression_discovery.txt.gz \
            GSE176260_Voom_weights_discovery.txt.gz; do
            curl --fail --location --retry 4 --retry-all-errors --connect-timeout 20 \
              --max-time 900 "$base/$file" -o "validation-artifacts/$file"
            gzip -t "validation-artifacts/$file"
          done
          sha256sum validation-artifacts/*.gz | tee validation-artifacts/SHA256SUMS.txt

      - name: Recompute limma-voom and compare with submitter-published E and weights
        run: |
          Rscript scripts/validate_gse176260_voom.R \
            validation-artifacts/GSE176260_QCed_counts_discovery.txt.gz \
            validation-artifacts/GSE176260_Log2_normalized_expression_discovery.txt.gz \
            validation-artifacts/GSE176260_Voom_weights_discovery.txt.gz \
            validation-artifacts/gse176260-reference-report.json

      - name: Upload reproducible validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: oracle-gse176260-external-voom-reference
          path: validation-artifacts/
          if-no-files-found: error
          retention-days: 30

  gse176261-validation-cohort:
    name: GSE176261 same-study validation cohort
    needs: gse176260-reference
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out ORACLE
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.2"
          use-public-rspm: true

      - name: Install GEOquery, edgeR, limma, and digest
        run: |
          Rscript -e 'if (!requireNamespace("BiocManager", quietly=TRUE)) install.packages("BiocManager", repos="https://cloud.r-project.org")'
          Rscript -e 'BiocManager::install(c("GEOquery", "edgeR", "limma"), ask=FALSE, update=FALSE, Ncpus=2)'
          Rscript -e 'if (!requireNamespace("digest", quietly=TRUE)) install.packages("digest", repos="https://cloud.r-project.org")'
          Rscript -e 'stopifnot(requireNamespace("GEOquery"), requireNamespace("edgeR"), requireNamespace("limma"), requireNamespace("digest"))'

      - name: Download frozen GEO validation-cohort reference files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation-artifacts
          base="https://ftp.ncbi.nlm.nih.gov/geo/series/GSE176nnn/GSE176261/suppl"
          for file in \
            GSE176261_QCed_counts_batch2_validationsamples.txt.gz \
            GSE176261_Log2_normalized_expression_batch2_validationsamples.txt.gz \
            GSE176261_Voom_weights_batch2_validationsamples.txt.gz; do
            curl --fail --location --retry 4 --retry-all-errors --connect-timeout 20 \
              --max-time 900 "$base/$file" -o "validation-artifacts/$file"
            gzip -t "validation-artifacts/$file"
          done
          sha256sum validation-artifacts/*.gz | tee validation-artifacts/GSE176261_SHA256SUMS.txt

      - name: Recompute same-study validation-cohort limma-voom and compare with published E and weights
        run: |
          Rscript scripts/validate_gse176261_voom.R \
            validation-artifacts/GSE176261_QCed_counts_batch2_validationsamples.txt.gz \
            validation-artifacts/GSE176261_Log2_normalized_expression_batch2_validationsamples.txt.gz \
            validation-artifacts/GSE176261_Voom_weights_batch2_validationsamples.txt.gz \
            validation-artifacts/gse176261-reference-report.json

      - name: Upload same-study validation-cohort evidence
        uses: actions/upload-artifact@v4
        with:
          name: oracle-gse176261-same-study-validation-cohort
          path: validation-artifacts/
          if-no-files-found: error
          retention-days: 30

  gse158765-independent-study:
    name: GSE158765 independent-study published voom reference
    needs: gse176260-reference
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out ORACLE
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.2"
          use-public-rspm: true

      - name: Install GEOquery, edgeR, limma, digest, and jsonlite
        run: |
          Rscript -e 'if (!requireNamespace("BiocManager", quietly=TRUE)) install.packages("BiocManager", repos="https://cloud.r-project.org")'
          Rscript -e 'BiocManager::install(c("GEOquery", "edgeR", "limma"), ask=FALSE, update=FALSE, Ncpus=2)'
          Rscript -e 'install.packages(c("digest", "jsonlite"), repos="https://cloud.r-project.org")'
          Rscript -e 'stopifnot(requireNamespace("GEOquery"), requireNamespace("edgeR"), requireNamespace("limma"), requireNamespace("digest"), requireNamespace("jsonlite"))'

      - name: Recompute GSE158765 repeated-measures limma-voom and compare published E and weights
        run: |
          Rscript scripts/validate_gse158765_voom.R validation-artifacts/gse158765-reference-report.json

      - name: Upload independent-study validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: oracle-gse158765-independent-study-voom-reference
          path: validation-artifacts/gse158765-reference-report.json
          if-no-files-found: error
          retention-days: 30
