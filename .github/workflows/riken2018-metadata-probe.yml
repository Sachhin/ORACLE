name: ORACLE RIKEN 2018 supercentenarian metadata probe

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/riken2018-metadata-probe.yml"
      - "scripts/probe_riken2018_metadata.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parquet reader
        run: python -m pip install --disable-pip-version-check pandas==2.2.3 pyarrow==18.1.0
      - name: Download and inspect source-checksummed metadata
        run: python scripts/probe_riken2018_metadata.py
      - uses: actions/upload-artifact@v4
        with:
          name: oracle-riken2018-metadata-probe
          path: artifacts/riken2018/
          if-no-files-found: error
          retention-days: 90
