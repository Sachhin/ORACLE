name: ORACLE RIKEN SC2018 independent mRPG pseudobulk validation

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/riken2018-mrpg-validation.yml"
      - "scripts/analyze_riken2018_mrpg.py"
      - "scripts/edgeR_riken2018_mrpg.R"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-riken2018-mrpg-${{ github.ref }}
  cancel-in-progress: false

jobs:
  donor-pseudobulk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install sparse matrix and Parquet readers
        run: python -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.13.1 pandas==2.2.3 pyarrow==18.1.0 h5py==3.12.1
      - name: Install edgeR
        run: |
          sudo apt-get update
          sudo apt-get install -y r-base-core r-bioc-edger
          Rscript -e 'library(edgeR); packageVersion("edgeR")'
      - name: Verify public source checksums and build donor-level pseudobulk
        run: python scripts/analyze_riken2018_mrpg.py
      - name: Run TMM-normalized edgeR and exact donor-label permutation test
        run: |
          Rscript scripts/edgeR_riken2018_mrpg.R \
            artifacts/riken2018-mrpg/pseudobulk_counts.tsv \
            artifacts/riken2018-mrpg/donor_metadata.tsv \
            artifacts/riken2018-mrpg all_batches
          Rscript scripts/edgeR_riken2018_mrpg.R \
            artifacts/riken2018-mrpg/pseudobulk_counts_firstrun.tsv \
            artifacts/riken2018-mrpg/donor_metadata_firstrun.tsv \
            artifacts/riken2018-mrpg firstrun_only
      - name: Verify donor-level leave-one-out sensitivity outputs
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          root = Path("artifacts/riken2018-mrpg")
          for label in ("all_batches", "firstrun_only"):
              path = root / f"mRPG8_panel_leave_one_out_{label}.tsv"
              if not path.is_file():
                  raise SystemExit(f"Missing leave-one-donor-out output: {path}")
              with path.open(newline="") as handle:
                  rows = list(csv.DictReader(handle, delimiter="\t"))
              if len(rows) != 12:
                  raise SystemExit(f"{path}: expected 12 donor-deletion rows, found {len(rows)}")
              if len({row["dropped_patient"] for row in rows}) != 12:
                  raise SystemExit(f"{path}: donor deletion IDs are not unique")
              for row in rows:
                  difference = float(row["score_difference_SC_minus_CT"])
                  p_value = float(row["exact_two_sided_permutation_p"])
                  if not (-1.0 <= difference <= 1.0 and 0.0 <= p_value <= 1.0):
                      raise SystemExit(f"{path}: invalid sensitivity statistic: {row}")
              print(f"{label}: verified {len(rows)} unique donor-deletion tests")
          PY
      - name: Upload donor-level analysis and provenance
        uses: actions/upload-artifact@v4
        with:
          name: oracle-riken2018-mrpg-independent-validation
          path: artifacts/riken2018-mrpg/
          if-no-files-found: error
          retention-days: 90
