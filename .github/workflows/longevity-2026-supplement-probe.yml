name: ORACLE 2026 longevity paper supplementary data probe

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/longevity-2026-supplement-probe.yml"
      - "scripts/probe_longevity_2026_supplements.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrieve-supplements:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Retrieve 2026 longevity paper supplements and checksums
        run: python scripts/probe_longevity_2026_supplements.py
      - uses: actions/upload-artifact@v4
        with:
          name: oracle-longevity-2026-supplementary-data
          path: artifacts/longevity-2026-supplements/
          if-no-files-found: error
          retention-days: 90
