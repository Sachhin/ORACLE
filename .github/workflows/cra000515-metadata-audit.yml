name: ORACLE CRA000515 centenarian metadata acquisition and audit

on:
  workflow_dispatch:
    inputs:
      accession:
        description: Public GSA study accession
        required: true
        default: CRA000515
        type: string
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/cra000515-metadata-audit.yml"
      - "scripts/acquire_cra000515_metadata.py"
      - "tests/test_cra000515_metadata.py"

permissions:
  contents: read

jobs:
  acquire-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bounded metadata dependencies
        run: python -m pip install "requests>=2.31,<3" "openpyxl>=3.1,<4"
      - name: Run offline acquisition unit tests
        run: python -m unittest discover -s tests -p 'test_cra000515_metadata.py' -v
      - name: Acquire GSA metadata only (no BAM downloads)
        if: github.event_name == 'workflow_dispatch'
        run: |
          python scripts/acquire_cra000515_metadata.py \
            --accession "${{ inputs.accession }}" \
            --output-dir artifacts/cra000515
      - name: Upload source metadata, joined manifest, audit and checksums
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: cra000515-source-metadata-audit
          path: artifacts/cra000515/
          if-no-files-found: error
          retention-days: 90
